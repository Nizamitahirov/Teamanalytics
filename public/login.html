<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090A13">
  <meta name="robots" content="noindex">
  <title>Giriş — Workforce Planning</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #090A13; color: #fff; display: grid; place-items: center; overflow: hidden; -webkit-font-smoothing: antialiased; }
    .glow { position: fixed; border-radius: 50%; filter: blur(10px); pointer-events: none; }
    .g1 { width: 720px; height: 720px; left: -260px; top: -320px; background: radial-gradient(circle, rgba(227,6,19,.45), transparent 62%); }
    .g2 { width: 640px; height: 640px; right: -240px; bottom: -300px; background: radial-gradient(circle, rgba(255,122,26,.40), transparent 62%); }
    .grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(circle at center, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%); }
    .wrap { position: relative; z-index: 1; width: min(420px, calc(100vw - 32px)); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .mark { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(120deg, #E30613, #F23A1C 42%, #FF6B17 78%, #FF9524); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(242,58,28,.5); }
    .brand b { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
    .brand small { color: rgba(255,255,255,.55); }
    .card { background: rgba(18,20,31,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 30px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    h1 { margin: 0 0 6px; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
    h1 span { background: linear-gradient(120deg, #FF3B2F, #FF9524); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.sub { margin: 0 0 24px; color: rgba(255,255,255,.6); font-size: .9rem; }
    label { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: rgba(255,255,255,.55); margin: 0 0 7px; }
    .f { margin-bottom: 16px; position: relative; }
    input { width: 100%; height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: #fff; font: inherit; font-size: 1rem; transition: border-color .15s, box-shadow .15s, background .15s; }
    input:focus { outline: none; border-color: #FF6B17; background: rgba(255,255,255,.08); box-shadow: 0 0 0 4px rgba(255,107,23,.18); }
    .eye { position: absolute; right: 8px; bottom: 8px; height: 32px; padding: 0 10px; border: none; border-radius: 9px; background: rgba(255,255,255,.07); color: rgba(255,255,255,.7); cursor: pointer; font: inherit; font-size: .78rem; font-weight: 600; }
    button.go { width: 100%; height: 50px; margin-top: 8px; border: none; border-radius: 13px; background: linear-gradient(120deg, #E30613, #F23A1C 42%, #FF6B17 78%, #FF9524); color: #fff; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 12px 30px rgba(242,58,28,.4); transition: filter .15s, transform .1s; }
    button.go:hover { filter: brightness(1.06); }
    button.go:active { transform: translateY(1px); }
    button.go:disabled { opacity: .6; cursor: wait; }
    .err { min-height: 22px; margin-top: 12px; color: #FF8A80; font-size: .88rem; text-align: center; }
    .foot { text-align: center; margin-top: 18px; color: rgba(255,255,255,.35); font-size: .78rem; }
  </style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
  <main class="wrap">
    <div class="brand">
      <div class="mark"><svg width="26" height="26" viewBox="0 0 64 64"><path d="M14 42l10-20 8 12 8-8 10 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Workforce Planning</b><small>Əmək Münasibətləri</small></div>
    </div>
    <form class="card" id="f" autocomplete="on">
      <h1>Xoş <span>gəlmisiniz</span></h1>
      <p class="sub">Davam etmək üçün adınızı və parolunuzu daxil edin.</p>
      <div class="f"><label for="u">İstifadəçi adı</label><input id="u" name="username" autocomplete="username" required autofocus></div>
      <div class="f"><label for="p">Parol</label><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye">Göstər</button></div>
      <button class="go" id="go" type="submit">Daxil ol</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="foot">Giriş məlumatlarını sistem administratorundan alın.</div>
  </main>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
    document.getElementById('eye').onclick = (e) => { const p = document.getElementById('p'); const show = p.type === 'password'; p.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Gizlət' : 'Göstər'; };
    f.onsubmit = async (e) => {
      e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Yoxlanılır...';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
        const j = await r.json().catch(() => ({}));
        if (r.ok) { location.href = '/'; return; }
        err.textContent = j.error || 'Giriş alınmadı';
      } catch { err.textContent = 'Serverə qoşulmaq alınmadı'; }
      go.disabled = false; go.textContent = 'Daxil ol';
    };
  </script>
</body>
</html>
